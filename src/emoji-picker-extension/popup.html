<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb; --bg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6e6e6; --muted:#9aa0a6; --line:#33353a; --bg:#1e1f22; } }
  body { margin:0; width:352px; background:var(--bg); color:var(--fg);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  #picker { height:400px; }
  .opts { border-top:1px solid var(--line); padding:10px 12px; }
  label { display:flex; gap:8px; align-items:flex-start; margin:4px 0; cursor:pointer; }
  small { color:var(--muted); display:block; }
  #toast { position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:6px 12px;
    border-radius:8px; font-size:13px; opacity:0; transition:opacity .15s; pointer-events:none; }
  #toast.on { opacity:.92; }
</style>
</head>
<body>
  <div id="picker"></div>
  <div class="opts">
    <label><input type="radio" name="mode" value="menu">
      <span>우클릭 메뉴에 "😀 이모지 넣기" 항목 추가 (기본)<small>원래 메뉴 그대로 + 이모지 항목</small></span></label>
    <label><input type="radio" name="mode" value="rightclick">
      <span>입력창 우클릭 = 바로 이모지 피커<small>원래 메뉴는 Shift+우클릭</small></span></label>
    <small style="margin-top:6px">여기서 고르면 클립보드에 복사돼요 — 메모장·카톡 등 다른 앱에 붙여넣기(Ctrl+V)</small>
  </div>
  <div id="toast"></div>
  <script src="data.js"></script>
  <script src="picker.js"></script>
  <script src="popup.js"></script>
</body>
</html>
